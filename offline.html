<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>غير متصل — مدرسة خالد بن الوليد للتعليم الأساسي</title>
  <meta name="theme-color" content="#1e3a8a">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Tajawal', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 55%, #1d4ed8 100%);
      color: #fff; display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh; text-align: center; padding: 24px;
    }
    .icon {
      width: 96px; height: 96px; border-radius: 26px; display: flex; align-items: center; justify-content: center;
      font-size: 44px; background: rgba(255,255,255,0.14); border: 2px solid rgba(255,255,255,0.25);
      margin-bottom: 24px; animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
    h1 { font-size: 28px; font-weight: 900; margin-bottom: 12px; }
    p { font-size: 16px; color: rgba(255,255,255,0.85); margin-bottom: 32px; line-height: 1.8; max-width: 420px; }
    button {
      padding: 14px 34px; background: linear-gradient(135deg, #10b981, #059669);
      color: #fff; border: none; border-radius: 50px; font-family: 'Tajawal', sans-serif;
      font-size: 16px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 10px;
      box-shadow: 0 12px 32px rgba(16,185,129,0.4); transition: transform 0.25s ease;
    }
    button:hover { transform: translateY(-2px); }
    .footer { position: fixed; bottom: 24px; font-size: 13px; color: rgba(255,255,255,0.6); }
  </style>
</head>
<body>
  <div class="icon"><i class="fa-solid fa-school"></i></div>
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>نظام الإدارة المدرسية بمدرسة خالد بن الوليد للتعليم الأساسي يحتاج اتصالاً نشطاً بالإنترنت للعمل.<br>يرجى التحقق من الشبكة ثم إعادة المحاولة.</p>
  <button type="button" onclick="location.reload()">
    <i class="fa-solid fa-rotate-right"></i>
    <span>إعادة المحاولة</span>
  </button>
  <div class="footer">مدرسة خالد بن الوليد للتعليم الأساسي — منظومة رَصْد (v8.3.3)</div>
</body>
</html>
